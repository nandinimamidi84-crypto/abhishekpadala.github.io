<!DOCTYPE html>
<html>
<head>

    <title>Video Editing</title>

    <style>

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            text-align: center;
        }

        h1 {
            color: #3d7a45;
            margin-bottom: 30px;
        }

        .video-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .video-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        video {
            width: 350px;
            height: 220px;
            object-fit: contain;
            background: #eeeeee;
            border-radius: 10px;
        }

        .video-card h3 {
            color: #3d7a45;
            margin-bottom: 5px;
        }

        .video-card p {
            color: #666;
        }

    </style>

</head>
