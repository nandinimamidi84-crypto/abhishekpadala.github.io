<!DOCTYPE html>
<html>
<head>

    <title>Motion Graphics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #3d7a45;
        }

        .video-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

      video {
    width: 350px;
    height: 220px;
    object-fit: contain;
    background: #eeeeee;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}
    </style>

</head>

<body>

    <h1>My Motion Graphics</h1>

    <div class="video-container">

        <video controls>
            <source src="Motion graphics/mp2.mp4" type="video/mp4">
        </video>

        <video controls>
            <source src="Motion graphics/pizza.mp4" type="video/mp4">
        </video>

        <video controls>
            <source src="Motion graphics/KGF.mp4" type="video/mp4">
        </video>
        <video controls>
            <source src="Motion graphics/drink.mp4" type="video/mp4">
        </video>
        <video controls>
            <source src="Motion graphics/liquid logo.mp4" type="video/mp4">
        </video>
        <video controls>
            <source src="Motion graphics/animi.mp4" type="video/mp4">
        </video>

    </div>

</body>
</html>
